<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
           script-src 'self';
           style-src 'self' 'unsafe-inline';
           img-src 'self' data: local:;
           font-src 'self' data:"
    />

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      .canvas-container {
        cursor: grab;
      }
      .canvas-container:active {
        cursor: grabbing;
      }
      .crosshair-lines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .canvas-container:hover .crosshair-lines {
        opacity: 1;
      }
      .crosshair-line {
        position: absolute;
        background-color: rgba(229, 231, 235, 0.7);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      }
      .crosshair-horizontal {
        width: 100%;
        height: 1px;
        left: 0;
      }
      .crosshair-vertical {
        width: 1px;
        height: 100%;
        top: 0;
      }
      #canvas {
        transition: transform 0.2s ease-out;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
